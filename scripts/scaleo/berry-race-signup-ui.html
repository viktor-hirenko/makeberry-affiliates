<script>
(function() {

  var TERMS_URL = 'https://affiliate.makeberry.com/terms-and-conditions';
  var PRIVACY_URL = 'https://affiliate.makeberry.com/privacy-policy';

  var PROMO =
    '<div class="mb-promo">' +
      '<div class="mb-bg"></div>' +
      '<div class="mb-ov"></div>' +
      '<div class="mb-cnt">' +
        '<div class="mb-badges">' +
          '<span class="mb-badge">Berry</span>' +
          '<span class="mb-badge">Race</span>' +
        '</div>' +
        '<div class="mb-dates">23.04 &mdash; 23.07.2026</div>' +
        '<h2 class="mb-h1">You drive &mdash;<br><em>we pay</em></h2>' +
        '<p class="mb-sub">Earn up to $2,000 extra for every 100 FTDs<br>on top of your standard earnings.</p>' +
        '<div class="mb-cards">' +
          '<div class="mb-card"><div class="mb-tier">Tier 1 GEOs</div><div class="mb-amount">$2,000</div><div class="mb-desc">per every 100 FTDs</div></div>' +
          '<div class="mb-card"><div class="mb-tier">Tier 2 GEOs</div><div class="mb-amount">$1,000</div><div class="mb-desc">per every 100 FTDs</div></div>' +
        '</div>' +
        '<div class="mb-unlim">' +
          '<span style="color:#FF0180;font-size:12px;margin-top:2px;flex-shrink:0">&#9654;</span>' +
          '<span class="mb-unlim-t"><strong>No cap on total FTDs</strong> &mdash; the more you drive, the more you earn.</span>' +
        '</div>' +
        '<div class="mb-src-lbl">Traffic sources we accept</div>' +
        '<div class="mb-tags">' +
          '<span class="mb-tag">ASO</span><span class="mb-tag">ASA</span>' +
          '<span class="mb-tag">PPC</span><span class="mb-tag">SEO</span>' +
          '<span class="mb-tag">Email</span><span class="mb-tag">SMS</span>' +
          '<span class="mb-tag">Reddit</span>' +
        '</div>' +
        '<p class="mb-cta">Sign Up to Join The Race &#8594;</p>' +
      '</div>' +
    '</div>';

  function injectPromo() {
    if (document.querySelector('.mb-promo')) return true;
    var c = document.querySelector('div.page-content-signup');
    if (!c) return false;
    var el = document.createElement('div');
    el.innerHTML = PROMO;
    c.insertBefore(el.firstElementChild, c.firstChild);
    return true;
  }

  function fixLegalLinks() {
    document.querySelectorAll('a[href]').forEach(function(a) {
      var text = (a.textContent || '').toLowerCase();
      var href = (a.getAttribute('href') || '').toLowerCase();

      if (/terms|услов|condition|terms-and-conditions/.test(text + ' ' + href)) {
        a.setAttribute('href', TERMS_URL);
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }

      if (/privacy|конфид|policy|privacy-policy/.test(text + ' ' + href)) {
        a.setAttribute('href', PRIVACY_URL);
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }
    });
  }

  function styleBtn() {
    document.querySelectorAll(
      'auth-signup-affiliate button[type=submit],' +
      'div.page-content-wrapper button[type=submit],' +
      '.registration-form button[type=submit]'
    ).forEach(function(btn) {
      btn.style.setProperty('background', '#FF0180', 'important');
      btn.style.setProperty('background-color', '#FF0180', 'important');
      btn.style.setProperty('border-color', '#FF0180', 'important');
      btn.style.setProperty('color', '#ffffff', 'important');
      btn.style.setProperty('border-radius', '100px', 'important');
    });
  }

  function stripSelectOuterBorder() {
    document.querySelectorAll('div.page-content-wrapper app-select').forEach(function(el) {
      el.style.setProperty('border', 'none', 'important');
      el.style.setProperty('background', 'transparent', 'important');
      el.style.setProperty('box-shadow', 'none', 'important');
    });
  }

  var promoInserted = false, n = 0;
  function runPromo() {
    if (promoInserted) return;
    if (injectPromo()) { promoInserted = true; return; }
    if (++n < 40) setTimeout(runPromo, 250);
  }

  var obs = new MutationObserver(function() {
    if (!promoInserted) runPromo();
    fixLegalLinks();
    styleBtn();
    stripSelectOuterBorder();
  });

  function start() {
    obs.observe(document.body, { childList: true, subtree: true });
    runPromo();
    fixLegalLinks();
    styleBtn();
    stripSelectOuterBorder();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

})();
</script>
