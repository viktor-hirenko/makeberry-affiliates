<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/logos/makeberry/favicon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Makeberry Affiliates — performance affiliate infrastructure for regulated iGaming brands."
    />
    <link
      rel="preload"
      href="/fonts/inter/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="/images/hero/home-bg-desktop.webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/hero/home-bg-mobile.webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <title>Makeberry Affiliates</title>
    <!--
      Inline background ставится до парсинга основного CSS, чтобы убрать
      белый flash между загрузкой HTML и mount Vue (на мобильном LTE это
      заметные 50–300 мс). Значение #000 совпадает с --color-bg-page.
    -->
    <style>
      html,
      body {
        background-color: #000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
